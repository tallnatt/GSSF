<VirtualHost *:80>
    ServerName gssf.local
    DocumentRoot /var/www/gssf

    <Directory /var/www/gssf>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gssf-error.log
    CustomLog ${APACHE_LOG_DIR}/gssf-access.log combined
</VirtualHost>
